name: Deploy to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — install, test, build
        run: |
          cd frontend
          npm ci
          npm test
          npm run build

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Backend — test and clippy
        run: |
          cd backend
          cargo test
          cargo clippy -- -D warnings

  deploy:
    runs-on: ubuntu-latest
    needs: verify-and-build
    steps:
      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist/

      - name: Sync frontend dist to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{secrets.EC2_HOST}}
          username: ubuntu
          key: ${{secrets.EC2_SSH_KEY}}
          source: "frontend-dist/"
          target: "/home/ubuntu/markdown_to_pdf/frontend/dist/"
          strip_components: 1

      - name: Deploy backend and restart services
        uses: appleboy/ssh-action@master
        with:
          host: ${{secrets.EC2_HOST}}
          username: ubuntu
          key: ${{secrets.EC2_SSH_KEY}}
          script: |
            set -e
            cd /home/ubuntu/markdown_to_pdf
            git fetch origin main
            git reset --hard origin/main

            # Build backend on EC2 (Rust compile needs ~1 GB; swap file must be active)
            cd backend
            cargo build --release

            # Restart services only after a successful build
            sudo systemctl restart md2pdf-api
            sudo systemctl restart caddy
